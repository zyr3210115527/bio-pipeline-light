<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bio Pipeline Light</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #242422; --muted: #83837d; --faint: #b5b5ae;
    --border: #e9e9e4; --border-soft: #f0f0eb;
    --accent: #232320; --green: #12834a; --green-bg: #e5f4ec;
    --amber: #a5720a; --amber-bg: #faf1de; --blue: #2f62c4; --blue-bg: #e9effb;
    --red: #c23b3b; --red-bg: #fbeaea; --gray-bg: #efefea;
    --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
      "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  /* ---------- 顶栏 ---------- */
  header {
    flex: none; display: flex; align-items: center; gap: 12px;
    padding: 13px 22px; background: rgba(247,247,245,.85);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
    position: relative; z-index: 10;
  }
  .logo {
    width: 30px; height: 30px; border-radius: 9px; flex: none; color: #fff;
    background: linear-gradient(135deg, #2b3a2e 0%, #4a6a52 55%, #7ba283 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .title { font-size: 15px; font-weight: 650; letter-spacing: .01em; }
  .subtitle { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .spacer { flex: 1; }
  .pill {
    display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 12px; cursor: default;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.ok { background: var(--green); box-shadow: 0 0 0 3px var(--green-bg); }
  .dot.bad { background: var(--red); box-shadow: 0 0 0 3px var(--red-bg); }
  .newchat {
    border: 1px solid var(--border); background: var(--card); border-radius: 999px;
    font-size: 12.5px; padding: 6px 15px; cursor: pointer; color: var(--text);
    transition: all .15s;
  }
  .newchat:hover { border-color: #d4d4cd; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  /* ---------- 消息区 ---------- */
  main { flex: 1; overflow-y: auto; }
  .col { max-width: 800px; margin: 0 auto; padding: 28px 22px 48px; }
  .welcome { padding: 10vh 0 44px; text-align: center; }
  .welcome .mark {
    width: 58px; height: 58px; border-radius: 17px; margin: 0 auto 20px;
    background: linear-gradient(135deg, #2b3a2e, #5d8266); color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(43,58,46,.22);
  }
  .welcome h1 { font-size: 25px; font-weight: 650; letter-spacing: .01em; margin-bottom: 10px; }
  .welcome p { color: var(--muted); font-size: 13.5px; line-height: 1.7; margin-bottom: 30px; }
  .chips { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; }
  .chip {
    border: 1px solid var(--border); background: var(--card); border-radius: 999px;
    padding: 8px 15px; font-size: 13px; cursor: pointer; color: var(--text);
    transition: all .15s;
  }
  .chip:hover { border-color: #c9d2c5; background: #f2f6f0; box-shadow: 0 2px 8px rgba(60,80,60,.08); }
  .msg { margin-bottom: 28px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .b {
    background: var(--accent); color: #f5f5f2; border-radius: 18px 18px 4px 18px;
    padding: 11px 16px; max-width: 78%; font-size: 14.5px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word;
    box-shadow: 0 2px 10px rgba(30,30,25,.14);
  }
  .msg.assistant .who {
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
    font-size: 13px; font-weight: 650; color: var(--text); letter-spacing: .01em;
  }
  .avatar {
    width: 24px; height: 24px; border-radius: 8px; flex: none; color: #fff;
    background: linear-gradient(135deg, #2b3a2e, #5d8266);
    display: flex; align-items: center; justify-content: center;
  }
  /* ---------- 思考块 ---------- */
  .think {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    margin-bottom: 10px; overflow: hidden; position: relative;
  }
  .think.live::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 2px;
    background: linear-gradient(90deg, transparent, #7ba283, transparent);
    animation: shimmer 1.6s ease-in-out infinite;
  }
  @keyframes shimmer { 0% { transform: translateX(-100%);} 100% { transform: translateX(100%);} }
  .think > .hd {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    font-size: 12.5px; color: var(--muted); cursor: pointer; user-select: none;
  }
  .think > .hd:hover { background: #fafaf8; }
  .think .bd {
    padding: 0 16px 13px 36px; font-size: 12.5px; line-height: 1.75; color: var(--muted);
    white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow-y: auto;
  }
  .think.collapsed .bd { display: none; }
  .caret { transition: transform .18s; flex: none; opacity: .55; }
  .think.collapsed .caret { transform: rotate(-90deg); }
  .spin {
    width: 12px; height: 12px; flex: none; border-radius: 50%;
    border: 2px solid #dcdcd5; border-top-color: #7ba283;
    animation: rot .8s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
  /* ---------- 工具时间线 ---------- */
  .timeline { position: relative; margin: 4px 0 12px 4px; padding-left: 22px; }
  .timeline::before {
    content: ""; position: absolute; left: 5px; top: 10px; bottom: 10px;
    width: 1.5px; background: var(--border);
  }
  .tstep { position: relative; margin-bottom: 8px; }
  .tstep::before {
    content: ""; position: absolute; left: -21.5px; top: 14px;
    width: 9px; height: 9px; border-radius: 50%;
    background: #d8d8d1; border: 2px solid var(--bg); z-index: 1;
  }
  .tstep.ok::before { background: var(--green); }
  .tstep.bad::before { background: var(--red); }
  .tstep.run::before { background: #c9a44a; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.35); opacity: .7; } }
  .tool {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; transition: box-shadow .15s;
  }
  .tool:hover { box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  .tool > .hd {
    display: flex; align-items: center; gap: 8px; padding: 9px 13px;
    cursor: pointer; user-select: none; font-size: 13px;
  }
  .tool .name { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
  .tool .st { color: var(--muted); font-size: 11.5px; margin-left: auto; display: flex; align-items: center; gap: 5px; }
  .tool .st.ok { color: var(--green); }
  .tool .st.bad { color: var(--red); }
  .tool .bd { display: none; border-top: 1px solid var(--border-soft); padding: 10px 13px; }
  .tool.open .bd { display: block; }
  .tool .lbl { font-size: 11px; color: var(--faint); margin: 6px 0 4px; letter-spacing: .03em; }
  .tool pre, .rawjson pre {
    background: #f6f6f2; border: 1px solid var(--border-soft); border-radius: 9px; padding: 9px 11px;
    font-family: var(--mono); font-size: 11.8px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-all; max-height: 260px; overflow-y: auto;
  }
  /* ---------- 回答 ---------- */
  .answer { font-size: 14.5px; line-height: 1.8; word-break: break-word; }
  .answer p { margin: 0 0 10px; }
  .answer p:last-child { margin-bottom: 0; }
  .answer h1, .answer h2, .answer h3, .answer h4 { margin: 16px 0 8px; line-height: 1.4; }
  .answer h1 { font-size: 19px; } .answer h2 { font-size: 17px; }
  .answer h3 { font-size: 15.5px; } .answer h4 { font-size: 14.5px; }
  .answer ul, .answer ol { margin: 6px 0 12px 22px; }
  .answer li { margin: 3px 0; }
  .answer code {
    font-family: var(--mono); font-size: 12.5px;
    background: #f1f1ec; border-radius: 5px; padding: 1.5px 5.5px;
  }
  .answer pre {
    background: #22271f; color: #e9ede6; border-radius: 12px; padding: 14px 16px;
    margin: 10px 0; overflow-x: auto; font-size: 12.5px; line-height: 1.65;
  }
  .answer pre code { background: none; color: inherit; padding: 0; }
  .answer a { color: var(--blue); text-decoration: none; }
  .cursor { display: inline-block; width: 8px; height: 15px; background: #999;
    vertical-align: -2px; animation: blink 1s steps(1) infinite; border-radius: 1px; }
  @keyframes blink { 50% { opacity: 0; } }
  .err {
    border: 1px solid #efd3d3; background: var(--red-bg); color: var(--red);
    border-radius: 12px; padding: 11px 14px; font-size: 13px; margin-top: 10px;
  }
  /* ---------- Plan 视图 ---------- */
  .plan {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    overflow: hidden; margin-top: 4px; box-shadow: 0 2px 12px rgba(40,45,40,.05);
  }
  .plan > .ph {
    display: flex; align-items: center; gap: 12px; padding: 15px 18px;
    background: linear-gradient(135deg, #f4f7f2, #eef3ec); border-bottom: 1px solid var(--border);
  }
  .plan .picon {
    width: 38px; height: 38px; border-radius: 11px; flex: none; color: #fff;
    background: linear-gradient(135deg, #2b3a2e, #5d8266);
    display: flex; align-items: center; justify-content: center;
  }
  .plan .pt { font-size: 15px; font-weight: 650; }
  .plan .ps { font-size: 12px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }
  .badge {
    margin-left: auto; font-size: 11.5px; font-weight: 600; border-radius: 999px;
    padding: 4px 11px; flex: none; letter-spacing: .02em;
  }
  .badge.ok { background: var(--green-bg); color: var(--green); }
  .badge.unsupported, .badge.no_candidate { background: var(--amber-bg); color: var(--amber); }
  .badge.information { background: var(--blue-bg); color: var(--blue); }
  .badge.rejected { background: var(--gray-bg); color: var(--muted); }
  .plan .pbody { padding: 14px 18px 16px; }
  .plan .sec { margin-top: 14px; }
  .plan .sec:first-child { margin-top: 0; }
  .plan .st {
    font-size: 11px; font-weight: 650; color: var(--faint); letter-spacing: .08em;
    text-transform: uppercase; margin-bottom: 8px;
  }
  .ichips { display: flex; flex-wrap: wrap; gap: 6px; }
  .ichip {
    font-size: 12px; background: #f3f4ef; border: 1px solid var(--border-soft);
    border-radius: 999px; padding: 3.5px 11px; color: #4a4a45;
  }
  .note { font-size: 13.5px; line-height: 1.7; color: #3c3c38; }
  /* 链步骤 */
  .chain { padding-left: 2px; }
  .cstep { display: flex; gap: 12px; position: relative; padding-bottom: 12px; }
  .cstep:last-child { padding-bottom: 0; }
  .cstep::before {
    content: ""; position: absolute; left: 13px; top: 30px; bottom: -2px;
    width: 1.5px; background: var(--border);
  }
  .cstep:last-child::before { display: none; }
  .cnum {
    width: 27px; height: 27px; border-radius: 50%; flex: none; z-index: 1;
    background: #eef2ea; border: 1.5px solid #c9d6c4; color: #41503f;
    font-size: 12px; font-weight: 650; display: flex; align-items: center; justify-content: center;
  }
  .cbody { flex: 1; min-width: 0; padding-top: 2px; }
  .cid { font-family: var(--mono); font-size: 13px; font-weight: 600; }
  .ccard {
    font-family: var(--mono); font-size: 10.5px; color: var(--muted);
    background: #f3f3ee; border-radius: 5px; padding: 1.5px 6px; margin-left: 7px;
  }
  .cio { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; align-items: center; }
  .io {
    font-family: var(--mono); font-size: 11px; background: #f6f6f2;
    border: 1px solid var(--border-soft); border-radius: 6px; padding: 2px 8px; color: #55554f;
  }
  .io.out { background: #eef4ee; border-color: #dde9dd; color: #33523a; }
  .iarrow { color: var(--faint); font-size: 12px; }
  /* IO 双列 */
  .iogrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .iocol h5 { font-size: 11.5px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  .iorow { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; flex-wrap: wrap; }
  .ioname { font-family: var(--mono); font-size: 12px; font-weight: 600; }
  .ioart { font-size: 10.5px; color: var(--muted); }
  .iofmt { font-family: var(--mono); font-size: 10.5px; background: #f3f3ee; border-radius: 4px; padding: 1px 5px; }
  .opt { font-size: 10px; color: var(--amber); background: var(--amber-bg); border-radius: 4px; padding: 1px 5px; }
  /* 资产表 */
  table.assets { width: 100%; border-collapse: collapse; font-size: 12px; }
  .assets th {
    text-align: left; font-size: 10.5px; color: var(--faint); font-weight: 650;
    letter-spacing: .05em; padding: 5px 8px; border-bottom: 1px solid var(--border);
  }
  .assets td { padding: 7px 8px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
  .assets tr:last-child td { border-bottom: none; }
  .assets .fn { font-family: var(--mono); font-size: 11.5px; word-break: break-all; }
  .assets .fp { font-family: var(--mono); font-size: 10.5px; color: var(--muted); word-break: break-all; }
  .role { font-size: 10.5px; font-weight: 600; border-radius: 5px; padding: 1.5px 7px; white-space: nowrap; }
  .role.tumor { background: #fbeaea; color: #b03535; }
  .role.normal { background: var(--green-bg); color: var(--green); }
  .role.none { background: var(--gray-bg); color: var(--faint); }
  .fchip { font-family: var(--mono); font-size: 10.5px; background: #eef0f6; color: #41538a;
    border-radius: 5px; padding: 1.5px 7px; white-space: nowrap; }
  .mreason { font-size: 10.5px; color: var(--faint); }
  /* 拒绝卡片 */
  .rej {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; display: flex; gap: 12px; align-items: flex-start;
  }
  .rej .ric {
    width: 32px; height: 32px; border-radius: 9px; flex: none;
    background: var(--gray-bg); color: var(--muted);
    display: flex; align-items: center; justify-content: center;
  }
  .rej .rt { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .rej .rr { font-size: 13px; color: var(--muted); line-height: 1.6; word-break: break-word; }
  .rawjson { margin-top: 12px; }
  .rawjson summary {
    font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; list-style: none;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .rawjson summary:hover { color: var(--text); }
  .rawjson pre { margin-top: 8px; max-height: 400px; }
  /* ---------- 输入区 ---------- */
  footer {
    flex: none; background: rgba(247,247,245,.9); backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
  }
  .inputwrap { max-width: 800px; margin: 0 auto; padding: 15px 22px 18px; }
  .box {
    display: flex; align-items: flex-end; gap: 10px;
    border: 1px solid #ddddD6; border-radius: 22px; padding: 11px 13px 11px 19px;
    background: var(--card); box-shadow: 0 4px 16px rgba(40,40,35,.07);
    transition: border-color .15s, box-shadow .15s;
  }
  .box:focus-within { border-color: #b9c4b3; box-shadow: 0 4px 20px rgba(60,80,60,.12); }
  textarea {
    flex: 1; border: none; outline: none; resize: none; background: none;
    font: inherit; font-size: 14.5px; line-height: 1.6; max-height: 160px; padding: 4px 0;
  }
  .send {
    width: 35px; height: 35px; border-radius: 50%; border: none; flex: none;
    background: var(--accent); color: #f5f5f2; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s, background .15s;
  }
  .send:hover:not(:disabled) { transform: scale(1.06); }
  .send:disabled { background: #d8d8d2; cursor: not-allowed; }
  .hint { text-align: center; font-size: 11px; color: var(--faint); margin-top: 9px; letter-spacing: .02em; }
</style>
</head>
<body>
<header>
  <div class="logo"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v5.2L3.6 16a3 3 0 0 0 2.7 4.4h11.4a3 3 0 0 0 2.7-4.4L16 8.2V3"/><path d="M7 15h10"/><path d="M9 3h6"/></svg></div>
  <div>
    <div class="title">Bio Pipeline Light</div>
    <div class="subtitle">生信分析链路规划 · MCP + LLM 在环推理</div>
  </div>
  <div class="spacer"></div>
  <div class="pill" id="healthPill" title="服务状态"><span class="dot" id="healthDot"></span><span id="healthText">连接中…</span></div>
  <button class="newchat" id="newChatBtn">＋ 新会话</button>
</header>
<main id="scroll"><div class="col" id="chat"></div></main>
<footer>
  <div class="inputwrap">
    <div class="box">
      <textarea id="input" rows="1" placeholder="描述你的分析需求，例如：我想用肝癌数据做 GO 富集分析"></textarea>
      <button class="send" id="sendBtn" title="发送">
        <svg id="sendIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <div class="hint">Enter 发送 · Shift+Enter 换行 · 规划依据来自 bio-pipeline-light 知识图谱（Neo4j）与 skill 手册</div>
  </div>
</footer>

<script>
"use strict";
const chatEl = document.getElementById("chat");
const scrollEl = document.getElementById("scroll");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const SVG_SEND = document.getElementById("sendIcon").outerHTML;
const SVG_STOP = '<svg id="sendIcon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>';

let sessionId = crypto.randomUUID();
let running = false;
let abortCtl = null;
let cur = null;

const EXAMPLES = [
  "我想用肝癌数据做 GO 富集分析",
  "帮我规划一个 WES 体细胞变异检测流程",
  "HRA001272 队列的样本角色分布是怎样的？",
  "对 HRA001272 做肿瘤-正常配对差异表达分析可以吗？",
];

/* ---------- 极简 Markdown 渲染 ---------- */
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function renderMarkdown(src) {
  const fences = [];
  src = src.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g, (m, lang, code) => {
    fences.push("<pre><code>" + esc(code.replace(/\n$/, "")) + "</code></pre>");
    return " F" + (fences.length - 1) + " ";
  });
  let s = esc(src);
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = s.split("\n"), out = [];
  let list = null;
  const closeList = () => { if (list) { out.push(list === "ul" ? "</ul>" : "</ol>"); list = null; } };
  for (const ln of lines) {
    let m;
    if ((m = ln.match(/^(#{1,4})\s+(.*)/))) {
      closeList(); out.push("<h" + m[1].length + ">" + m[2] + "</h" + m[1].length + ">");
    } else if ((m = ln.match(/^\s*[-*]\s+(.*)/))) {
      if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
      out.push("<li>" + m[1] + "</li>");
    } else if ((m = ln.match(/^\s*(\d+)[.)]\s+(.*)/))) {
      if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
      out.push("<li>" + m[2] + "</li>");
    } else {
      closeList(); out.push(ln);
    }
  }
  closeList();
  s = out.join("\n");
  s = s.split(/\n{2,}/).map(b =>
    /^<(h\d|ul|ol|pre)/.test(b.trim()) ? b : (b.trim() ? "<p>" + b.replace(/\n/g, "<br>") + "</p>" : "")
  ).join("\n");
  s = s.replace(/ F(\d+) /g, (m, i) => fences[+i]);
  return s;
}

/* ---------- Plan 提取与渲染 ---------- */
function extractPlan(text) {
  const start = text.indexOf("{");
  if (start < 0) return null;
  let depth = 0, inStr = false, escq = false;
  for (let i = start; i < text.length; i++) {
    const c = text[i];
    if (inStr) { if (escq) escq = false; else if (c === "\\") escq = true; else if (c === '"') inStr = false; continue; }
    if (c === '"') inStr = true;
    else if (c === "{") depth++;
    else if (c === "}") { depth--; if (depth === 0) {
      const raw = text.slice(start, i + 1);
      let plan = null;
      try { plan = JSON.parse(raw); }
      catch (e) {  // 模型偶发用中文弯引号——显示层宽容一次
        try { plan = JSON.parse(raw.replace(/[“”]/g, '"').replace(/[‘’]/g, "'")); } catch (e2) {}
      }
      if (plan && (plan.schema_version === "tool-chain/v2" || plan.status === "rejected"))
        return { plan, before: text.slice(0, start).trim(), after: text.slice(i + 1).trim() };
      return null;
    } }
  }
  return null;
}

function el(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; }
const STATUS_CN = { ok: "可执行", information: "信息", no_candidate: "无候选", unsupported: "暂不支持", missing_from_graph: "图内缺失" };

function planView(plan) {
  if (plan.status === "rejected") {
    const reason = String(plan.reason || "");
    const [kind, ...rest] = reason.split(/[:：]/);
    return el(`<div class="rej"><div class="ric"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg></div>
      <div><div class="rt">${kind === "privacy" ? "出于隐私保护，无法提供该信息" : "该请求不在生信规划服务范围内"}</div>
      <div class="rr">${esc(rest.join(":").trim() || reason)}</div></div></div>`);
  }
  const rec = (plan.recommendations || [])[0] || {};
  const tool = rec.tool || {};
  const data = rec.data || {};
  const intent = plan.intent || {};
  const st = plan.selection_status || "information";
  const name = tool.name || rec.pipeline_id || intent.analysis_goal || "规划结果";
  const sub = rec.pipeline_id || tool.tool_id || "";

  const root = el(`<div class="plan">
    <div class="ph"><div class="picon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v5.2L3.6 16a3 3 0 0 0 2.7 4.4h11.4a3 3 0 0 0 2.7-4.4L16 8.2V3"/><path d="M7 15h10"/></svg></div>
      <div><div class="pt">${esc(name)}</div><div class="ps">${esc(sub)}</div></div>
      <span class="badge ${st}">${STATUS_CN[st] || esc(st)}</span></div>
    <div class="pbody"></div></div>`);
  const body = root.querySelector(".pbody");

  const chips = [];
  if (intent.analysis_goal) chips.push("目标 " + intent.analysis_goal);
  if (intent.disease) chips.push(intent.disease);
  if (intent.omics_type) chips.push(intent.omics_type);
  (intent.study_accessions || []).forEach(s => chips.push(s));
  if (chips.length)
    body.appendChild(el(`<div class="sec"><div class="ichips">${chips.map(c => `<span class="ichip">${esc(c)}</span>`).join("")}</div></div>`));

  if (rec.match_note)
    body.appendChild(el(`<div class="sec"><div class="note">${esc(rec.match_note)}</div></div>`));

  // 原子链编排视图
  const cand = (plan.candidates || [])[0];
  if (cand && Array.isArray(cand.tool_chain) && cand.tool_chain.length) {
    // inputs/outputs 两种形态都要兼容：数组（["read1",...]）或绑定对象（{"read1": {...}}）
    const ioKeys = x => Array.isArray(x) ? x : (x && typeof x === "object" ? Object.keys(x) : []);
    const steps = cand.tool_chain.map((s, i) => `
      <div class="cstep"><div class="cnum">${i + 1}</div>
        <div class="cbody">
          <span class="cid">${esc(s.tool_id || "?")}</span>${s.card ? `<span class="ccard">${esc(s.card)}</span>` : ""}
          <div class="cio">${ioKeys(s.inputs).map(x => `<span class="io">${esc(x)}</span>`).join("")}
            <span class="iarrow">→</span>
            ${ioKeys(s.outputs).map(x => `<span class="io out">${esc(x)}</span>`).join("")}</div>
        </div></div>`).join("");
    body.appendChild(el(`<div class="sec"><div class="st">Atomic 链编排（${cand.tool_chain.length} 步）</div><div class="chain">${steps}</div></div>`));
  }

  // pipeline 工具 I/O
  const ins = tool.inputs || [], outs = tool.outputs || [];
  if (ins.length || outs.length) {
    const ioRow = x => `<div class="iorow"><span class="ioname">${esc(x.name || "")}</span>
      ${(x.formats || []).map(f => `<span class="iofmt">${esc(f)}</span>`).join("")}
      ${x.artifact ? `<span class="ioart">${esc(x.artifact)}</span>` : ""}
      ${x.optional ? '<span class="opt">可选</span>' : ""}</div>`;
    body.appendChild(el(`<div class="sec"><div class="st">工具 I/O 契约</div><div class="iogrid">
      <div class="iocol"><h5>输入</h5>${ins.map(ioRow).join("") || '<div class="ioart">无</div>'}</div>
      <div class="iocol"><h5>输出</h5>${outs.map(ioRow).join("") || '<div class="ioart">无</div>'}</div></div></div>`));
  }

  // 数据资产
  const assets = data.assets || [];
  if (assets.length) {
    const rows = assets.map(a => {
      const role = a.sample_role ? (a.sample_role === "tumor" ? "tumor" : "normal") : "none";
      const roleTxt = a.sample_role_label || a.sample_role || "—";
      return `<tr><td><div class="fn">${esc(a.file_name || "?")}</div>
          ${a.file_path ? `<div class="fp">${esc(a.file_path)}</div>` : ""}
          ${a.match_reason ? `<div class="mreason">${esc(a.match_reason)}</div>` : ""}</td>
        <td>${a.format ? `<span class="fchip">${esc(a.format)}</span>` : ""}</td>
        <td><span class="role ${role}">${esc(roleTxt)}</span></td>
        <td class="mreason">${esc(a.study_accession || "")}</td></tr>`;
    }).join("");
    body.appendChild(el(`<div class="sec"><div class="st">数据资产（${data.status || "?"} · ${assets.length} 项）</div>
      <table class="assets"><thead><tr><th>文件</th><th>格式</th><th>角色</th><th>队列</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`));
  } else if (data.status && data.status !== "not_applicable") {
    body.appendChild(el(`<div class="sec"><div class="st">数据</div><div class="note">状态：${esc(data.status)}${(data.missing_asset_names || []).length ? "；缺失：" + data.missing_asset_names.map(esc).join("、") : ""}</div></div>`));
  }

  const alts = data.alternatives || [];
  if (alts.length)
    body.appendChild(el(`<div class="sec"><div class="st">备选队列</div><div class="ichips">${
      alts.map(a => `<span class="ichip">${esc(a.study_accession || "")}${a.selected ? " ✓" : ""}</span>`).join("")}</div></div>`));

  // 原始 JSON
  const raw = el(`<details class="rawjson"><summary><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>查看原始 JSON</summary><pre></pre></details>`);
  raw.querySelector("pre").textContent = JSON.stringify(plan, null, 2);
  body.appendChild(raw);
  return root;
}

/* ---------- 滚动 ---------- */
function nearBottom() { return scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 120; }
function maybeScroll() { if (nearBottom()) scrollEl.scrollTop = scrollEl.scrollHeight; }

/* ---------- 消息 DOM ---------- */
function addUserMsg(text) {
  hideWelcome();
  const d = document.createElement("div");
  d.className = "msg user";
  d.innerHTML = '<div class="b"></div>';
  d.querySelector(".b").textContent = text;
  chatEl.appendChild(d);
  scrollEl.scrollTop = scrollEl.scrollHeight;
}
function newAssistantTurn() {
  const d = document.createElement("div");
  d.className = "msg assistant";
  d.innerHTML = '<div class="who"><div class="avatar"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v5.2L3.6 16a3 3 0 0 0 2.7 4.4h11.4a3 3 0 0 0 2.7-4.4L16 8.2V3"/><path d="M7 15h10"/></svg></div>Bio Pipeline Light</div><div class="body"></div>';
  chatEl.appendChild(d);
  cur = {
    root: d, body: d.querySelector(".body"),
    thinkBox: null, thinkBd: null, thinkDone: false,
    timeline: null, tools: {},
    answerEl: null, answerText: "", planRendered: false,
  };
  return cur;
}
function ensureThink() {
  if (cur.thinkBox) return cur.thinkBox;
  const box = document.createElement("div");
  box.className = "think live";
  box.innerHTML =
    '<div class="hd"><span class="spin"></span><span class="tt">正在思考…</span>' +
    '<svg class="caret" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></div>' +
    '<div class="bd"></div>';
  box.querySelector(".hd").onclick = () => box.classList.toggle("collapsed");
  cur.body.appendChild(box);
  cur.thinkBox = box; cur.thinkBd = box.querySelector(".bd");
  return box;
}
function finishThink() {
  if (!cur.thinkBox || cur.thinkDone) return;
  cur.thinkDone = true;
  cur.thinkBox.classList.remove("live");
  const hd = cur.thinkBox.querySelector(".hd");
  const sp = hd.querySelector(".spin");
  if (sp) sp.outerHTML =
    '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#83837d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  hd.querySelector(".tt").textContent = "思考过程";
  cur.thinkBox.classList.add("collapsed");
}
function ensureTimeline() {
  if (!cur.timeline) {
    finishThink();
    cur.timeline = document.createElement("div");
    cur.timeline.className = "timeline";
    cur.body.appendChild(cur.timeline);
  }
  return cur.timeline;
}
function addToolCard(ev) {
  const tl = ensureTimeline();
  const step = document.createElement("div");
  step.className = "tstep run";
  step.innerHTML =
    '<div class="tool"><div class="hd">' +
    '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#83837d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4.5 4.5 0 0 0-6 6L3 18l3 3 5.7-5.7a4.5 4.5 0 0 0 6-6L14 13l-3-3 3.7-3.7z"/></svg>' +
    '<span class="name"></span><span class="st">执行中…</span></div>' +
    '<div class="bd"><div class="lbl">参数</div><pre class="args"></pre>' +
    '<div class="lbl">返回</div><pre class="res">等待结果…</pre></div></div>';
  step.querySelector(".name").textContent = ev.name;
  step.querySelector(".args").textContent = JSON.stringify(ev.args, null, 2);
  step.querySelector(".hd").onclick = () => step.querySelector(".tool").classList.toggle("open");
  tl.appendChild(step);
  cur.tools[ev.id || ev.name + "_" + Object.keys(cur.tools).length] = step;
  maybeScroll();
}
function fillToolCard(ev) {
  const step = cur.tools[ev.id] || Object.values(cur.tools).find(c =>
    c.querySelector(".name").textContent === ev.name && c.classList.contains("run"));
  if (!step) return;
  step.classList.remove("run");
  step.classList.add(ev.ok ? "ok" : "bad");
  const st = step.querySelector(".st");
  st.className = "st " + (ev.ok ? "ok" : "bad");
  st.textContent = (ev.ok ? "完成" : "失败") + " · " + ev.duration_ms + "ms";
  let s = typeof ev.result === "string" ? ev.result : JSON.stringify(ev.result, null, 2);
  if (s.length > 6000) s = s.slice(0, 6000) + "\n…（内容过长已截断）";
  step.querySelector(".res").textContent = s;
  maybeScroll();
}
function ensureAnswer() {
  if (!cur.answerEl) {
    finishThink();
    const d = document.createElement("div");
    d.className = "answer";
    cur.body.appendChild(d);
    cur.answerEl = d;
    cur.answerText = "";
  }
  return cur.answerEl;
}
function renderFinalAnswer() {
  if (!cur.answerEl || cur.planRendered) return;
  const found = extractPlan(cur.answerText);
  if (found) {
    try {
      cur.planRendered = true;
      let html = "";
      if (found.before) html += renderMarkdown(found.before);
      if (found.after) html += renderMarkdown(found.after);
      cur.answerEl.innerHTML = html;
      cur.answerEl.appendChild(planView(found.plan));
    } catch (e) {  // 渲染兜底：任何渲染异常都不能吞掉答案本体
      cur.answerEl.innerHTML = renderMarkdown(cur.answerText);
    }
  } else {
    cur.answerEl.innerHTML = renderMarkdown(cur.answerText);
  }
}
function addError(message) {
  const d = document.createElement("div");
  d.className = "err";
  d.textContent = "出错了：" + message;
  (cur ? cur.body : chatEl).appendChild(d);
  scrollEl.scrollTop = scrollEl.scrollHeight;
}

/* ---------- 欢迎页 ---------- */
function showWelcome() {
  const w = document.createElement("div");
  w.className = "welcome"; w.id = "welcome";
  w.innerHTML = '<div class="mark"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v5.2L3.6 16a3 3 0 0 0 2.7 4.4h11.4a3 3 0 0 0 2.7-4.4L16 8.2V3"/><path d="M7 15h10"/><path d="M9 3h6"/></svg></div>' +
    "<h1>生信分析，先规划再执行</h1>" +
    "<p>基于 bio-pipeline-light：模型在环推理 + MCP 连接 Neo4j 知识图谱<br>产出经验证接地的 tool-chain/v2 工具链 Plan</p>" +
    '<div class="chips">' + EXAMPLES.map(e => '<button class="chip">' + e + "</button>").join("") + "</div>";
  chatEl.appendChild(w);
  w.querySelectorAll(".chip").forEach(c => c.onclick = () => { inputEl.value = c.textContent; send(); });
}
function hideWelcome() { const w = document.getElementById("welcome"); if (w) w.remove(); }

/* ---------- 发送与流式接收 ---------- */
async function send() {
  const text = inputEl.value.trim();
  if (!text || running) return;
  addUserMsg(text);
  inputEl.value = ""; inputEl.style.height = "auto";
  setRunning(true);
  newAssistantTurn();
  abortCtl = new AbortController();
  try {
    const resp = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session: sessionId, message: text }),
      signal: abortCtl.signal,
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status + "：" + (await resp.text()).slice(0, 200));
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const line = chunk.split("\n").find(l => l.startsWith("data:"));
        if (!line) continue;
        let ev; try { ev = JSON.parse(line.slice(5)); } catch { continue; }
        handleEvent(ev);
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") addError(e.message);
  } finally {
    finishThink();
    renderFinalAnswer();
    setRunning(false);
    abortCtl = null;
  }
}
function handleEvent(ev) {
  switch (ev.type) {
    case "thought": {
      const box = ensureThink();
      cur.thinkBd.textContent += ev.delta;
      cur.thinkBd.scrollTop = cur.thinkBd.scrollHeight;
      maybeScroll();
      break;
    }
    case "text": {
      const elA = ensureAnswer();
      cur.answerText += ev.delta;
      if (!cur.planRendered) elA.innerHTML = renderMarkdown(cur.answerText) + '<span class="cursor"></span>';
      maybeScroll();
      break;
    }
    case "tool_call": addToolCard(ev); break;
    case "tool_result": fillToolCard(ev); break;
    case "text_reset": {
      if (cur.answerEl) {
        cur.answerText = cur.answerText.slice(0, ev.keep || 0);
        cur.answerEl.innerHTML = renderMarkdown(cur.answerText);
      }
      break;
    }
    case "done": {
      finishThink();
      renderFinalAnswer();
      if (ev.finishReason && ev.finishReason !== "STOP") {
        const n = document.createElement("div");
        n.style.cssText = "font-size:12px;color:var(--faint);margin-top:6px";
        n.textContent = "（输出达到长度上限，可能被截断：" + ev.finishReason + "）";
        cur.body.appendChild(n);
      }
      break;
    }
    case "error": addError(ev.message); break;
  }
}
function setRunning(v) {
  running = v;
  document.getElementById("sendIcon").outerHTML = v ? SVG_STOP : SVG_SEND;
  sendBtn.title = v ? "停止" : "发送";
  inputEl.placeholder = v ? "正在生成，可点击右侧按钮停止…" : "描述你的分析需求，例如：我想用肝癌数据做 GO 富集分析";
}

/* ---------- 事件绑定 ---------- */
sendBtn.onclick = () => { if (running) { abortCtl && abortCtl.abort(); } else send(); };
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
});
document.getElementById("newChatBtn").onclick = async () => {
  if (running) { abortCtl && abortCtl.abort(); }
  try { await fetch("/api/reset", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session: sessionId }) }); } catch {}
  sessionId = crypto.randomUUID();
  chatEl.innerHTML = ""; cur = null;
  showWelcome(); inputEl.focus();
};

/* ---------- 健康检查 ---------- */
(async () => {
  try {
    const r = await (await fetch("/api/health")).json();
    const dot = document.getElementById("healthDot"), txt = document.getElementById("healthText");
    if (r.neo4j && r.neo4j.status === "ok") {
      dot.className = "dot ok";
      txt.textContent = "Neo4j " + (r.neo4j.nodes || "?").toLocaleString() + " 节点 · " + r.model;
    } else {
      dot.className = "dot bad";
      txt.textContent = "Neo4j 不可用 · " + r.model;
      document.getElementById("healthPill").title =
        (r.neo4j && r.neo4j.detail) || "请检查 NEO4J_USER / NEO4J_PASSWORD / NEO4J_URL";
    }
  } catch (e) {
    document.getElementById("healthText").textContent = "后端连接失败";
    document.getElementById("healthDot").className = "dot bad";
  }
})();

showWelcome();
inputEl.focus();
</script>
</body>
</html>
