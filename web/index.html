<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bio Pipeline Light · 生信链路规划</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232c5a3e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M8 3v5.2L3.6 16a3 3 0 0 0 2.7 4.4h11.4a3 3 0 0 0 2.7-4.4L16 8.2V3'/%3E%3Cpath d='M7 15h10'/%3E%3Cpath d='M9 3h6'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f3f5f3;
    --ink: #1c211d; --muted: #68716a; --faint: #9ba49c;
    --line: rgba(28, 33, 29, .09); --line-soft: rgba(28, 33, 29, .055);
    --glass: rgba(255, 255, 255, .62); --glass-strong: rgba(255, 255, 255, .8);
    --brand1: #143423; --brand2: #2c5a3e; --brand3: #6f9c7f;
    --green: #0e7a45; --green-bg: rgba(14, 122, 69, .1);
    --amber: #97690a; --amber-bg: rgba(151, 105, 10, .1);
    --blue: #2f62c4;  --blue-bg: rgba(47, 98, 196, .1);
    --red: #bf3d3d;   --red-bg: rgba(191, 61, 61, .09);
    --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --shadow-card: 0 1px 2px rgba(20, 30, 20, .04), 0 10px 32px rgba(20, 30, 20, .07);
    --shadow-pop: 0 2px 6px rgba(20, 30, 20, .05), 0 18px 50px rgba(20, 30, 20, .12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
      "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  /* 背景：极浅色渐变光晕 + 细点阵网格（毛玻璃的「景物」） */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(640px 440px at 8% -8%, rgba(111, 156, 127, .3), transparent 62%),
      radial-gradient(760px 540px at 106% 14%, rgba(47, 98, 196, .13), transparent 62%),
      radial-gradient(600px 500px at 82% 110%, rgba(151, 105, 10, .09), transparent 60%),
      var(--bg);
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .4;
    background-image: radial-gradient(rgba(28, 33, 29, .06) 1px, transparent 1.1px);
    background-size: 24px 24px;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 14%, #000 82%, transparent);
    mask-image: linear-gradient(to bottom, transparent, #000 14%, #000 82%, transparent);
  }

  /* ---------- 悬浮毛玻璃顶栏 ---------- */
  header {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 30;
    width: min(960px, calc(100% - 28px));
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--glass); border: 1px solid rgba(255, 255, 255, .78);
    border-radius: 18px; box-shadow: var(--shadow-card);
    backdrop-filter: blur(22px) saturate(1.6); -webkit-backdrop-filter: blur(22px) saturate(1.6);
  }
  .logo {
    width: 32px; height: 32px; border-radius: 10px; flex: none; color: #fff;
    background: linear-gradient(135deg, var(--brand1), var(--brand2) 55%, var(--brand3));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(20, 52, 35, .3), inset 0 1px 0 rgba(255, 255, 255, .22);
  }
  .title { font-size: 15px; font-weight: 680; letter-spacing: .01em; }
  .subtitle { font-size: 11px; color: var(--muted); margin-top: 1px; letter-spacing: .02em; }
  .spacer { flex: 1; }
  .pill {
    display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted);
    background: rgba(255, 255, 255, .55); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 13px; cursor: default;
    font-feature-settings: "tnum";
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.ok { background: var(--green); box-shadow: 0 0 0 3px var(--green-bg); }
  .dot.bad { background: var(--red); box-shadow: 0 0 0 3px var(--red-bg); }
  .newchat {
    border: 1px solid var(--line); background: rgba(255, 255, 255, .55);
    border-radius: 999px; font-size: 12.5px; padding: 6px 15px; cursor: pointer;
    color: var(--ink); transition: all .18s;
  }
  .newchat:hover { background: rgba(255, 255, 255, .9); box-shadow: 0 2px 10px rgba(20, 30, 20, .08); }

  /* ---------- 消息流 ---------- */
  main { flex: 1; overflow-y: auto; position: relative; z-index: 1; scroll-behavior: smooth; }
  .col { max-width: 920px; margin: 0 auto; padding: 96px 24px 40px; }
  .msg { margin-bottom: 30px; animation: rise .38s cubic-bezier(.2, .7, .3, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .b {
    background: linear-gradient(135deg, #1b3527, #2c4f3a); color: #f3f6f2;
    border-radius: 20px 20px 6px 20px; padding: 12px 17px; max-width: 76%;
    font-size: 14.5px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
    box-shadow: 0 6px 22px rgba(20, 45, 30, .22), inset 0 1px 0 rgba(255, 255, 255, .12);
  }
  .msg.assistant .who {
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
    font-size: 12.5px; font-weight: 650; color: var(--muted); letter-spacing: .02em;
  }
  .avatar {
    width: 23px; height: 23px; border-radius: 8px; flex: none; color: #fff;
    background: linear-gradient(135deg, var(--brand1), var(--brand3));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 10px rgba(20, 52, 35, .25);
  }

  /* ---------- 思考段（弱化：默认折叠的一行） ---------- */
  .think { margin-bottom: 10px; }
  .think > .hd {
    display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px 4px 4px;
    font-size: 12px; color: var(--faint); cursor: pointer; user-select: none;
    border-radius: 8px; transition: color .15s;
  }
  .think > .hd:hover { color: var(--muted); }
  .think .bd {
    display: none; margin: 6px 0 2px 4px; padding: 10px 14px;
    background: var(--glass); border: 1px solid var(--line-soft); border-radius: 12px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    font-size: 12px; line-height: 1.75; color: var(--muted);
    white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow-y: auto;
  }
  .think.open .bd { display: block; }
  .caret { transition: transform .18s; flex: none; opacity: .6; }
  .think.open .caret { transform: rotate(90deg); }
  .spin {
    width: 11px; height: 11px; flex: none; border-radius: 50%;
    border: 1.8px solid rgba(28, 33, 29, .12); border-top-color: var(--brand3);
    animation: rot .8s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* ---------- 工具调用（只露名字的一排 chips） ---------- */
  .tools { margin: 2px 0 12px; }
  .tlabel {
    font-size: 10.5px; font-weight: 650; color: var(--faint);
    letter-spacing: .1em; text-transform: uppercase; margin-bottom: 7px;
    display: flex; align-items: center; gap: 8px;
  }
  .tlabel::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }
  .tflow { display: flex; flex-wrap: wrap; gap: 6px; }
  .tchip {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 11.5px; color: #3d4740;
    background: var(--glass); border: 1px solid var(--line); border-radius: 9px;
    padding: 4px 10px; box-shadow: 0 1px 3px rgba(20, 30, 20, .04);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    animation: rise .3s ease both;
  }
  .tchip .st-dot { width: 6px; height: 6px; border-radius: 50%; background: #c8cec8; flex: none; }
  .tchip.run .st-dot { background: #d3a83f; animation: blink 1s steps(1) infinite; }
  .tchip.ok .st-dot { background: var(--green); }
  .tchip.bad .st-dot { background: var(--red); }
  .tchip.bad { color: var(--red); border-color: rgba(191, 61, 61, .25); }
  .tchip .dur { color: var(--faint); font-size: 10px; }
  .tchip .auto {
    font-family: inherit; font-size: 9.5px; color: var(--blue);
    background: var(--blue-bg); border-radius: 4px; padding: .5px 5px; letter-spacing: .03em;
  }
  @keyframes blink { 50% { opacity: .25; } }

  /* ---------- 正文 Markdown ---------- */
  .answer { font-size: 14.5px; line-height: 1.85; word-break: break-word; }
  .answer p { margin: 0 0 10px; }
  .answer p:last-child { margin-bottom: 0; }
  .answer h1, .answer h2, .answer h3, .answer h4 { margin: 16px 0 8px; line-height: 1.4; }
  .answer h1 { font-size: 19px; } .answer h2 { font-size: 17px; }
  .answer h3 { font-size: 15.5px; } .answer h4 { font-size: 14.5px; }
  .answer ul, .answer ol { margin: 6px 0 12px 22px; }
  .answer li { margin: 3px 0; }
  .answer code {
    font-family: var(--mono); font-size: 12.5px;
    background: rgba(28, 33, 29, .05); border-radius: 5px; padding: 1.5px 5.5px;
  }
  .answer pre {
    background: #1d261f; color: #e9ede6; border-radius: 12px; padding: 14px 16px;
    margin: 10px 0; overflow-x: auto; font-size: 12.5px; line-height: 1.65;
  }
  .answer pre code { background: none; color: inherit; padding: 0; }
  .answer a { color: var(--blue); text-decoration: none; }
  .cursor { display: inline-block; width: 8px; height: 15px; background: #9ba49c;
    vertical-align: -2px; animation: blink 1s steps(1) infinite; border-radius: 1px; }
  .err {
    border: 1px solid rgba(191, 61, 61, .22); background: var(--red-bg); color: var(--red);
    border-radius: 12px; padding: 11px 14px; font-size: 13px; margin-top: 10px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }

  /* ---------- Plan 卡片（视觉核心） ---------- */
  .plan {
    position: relative; margin-top: 6px; border-radius: 20px; overflow: hidden;
    background: var(--glass-strong); border: 1px solid rgba(255, 255, 255, .85);
    box-shadow: var(--shadow-pop);
    backdrop-filter: blur(26px) saturate(1.5); -webkit-backdrop-filter: blur(26px) saturate(1.5);
    animation: rise .45s cubic-bezier(.2, .7, .3, 1) both;
  }
  .plan::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
    background: linear-gradient(90deg, var(--brand1), var(--brand3), rgba(47, 98, 196, .55));
  }
  .plan > .ph {
    display: flex; align-items: center; gap: 14px; padding: 18px 22px 15px;
    border-bottom: 1px solid var(--line-soft);
    background: linear-gradient(135deg, rgba(111, 156, 127, .1), rgba(47, 98, 196, .05));
  }
  .plan .picon {
    width: 42px; height: 42px; border-radius: 13px; flex: none; color: #fff;
    background: linear-gradient(135deg, var(--brand1), var(--brand2) 55%, var(--brand3));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(20, 52, 35, .3), inset 0 1px 0 rgba(255, 255, 255, .25);
  }
  .plan .pt { font-size: 16px; font-weight: 680; letter-spacing: .01em; }
  .plan .ps { font-size: 11.5px; color: var(--muted); font-family: var(--mono); margin-top: 3px; }
  .plan .pmeta { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
  .grounded {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; color: var(--green);
    background: var(--green-bg); border-radius: 999px; padding: 4px 10px;
  }
  .badge {
    font-size: 11.5px; font-weight: 650; border-radius: 999px;
    padding: 5px 13px; letter-spacing: .03em; flex: none;
  }
  .badge.ok { background: var(--green-bg); color: var(--green); }
  .badge.unsupported, .badge.no_candidate { background: var(--amber-bg); color: var(--amber); }
  .badge.information { background: var(--blue-bg); color: var(--blue); }
  .badge.missing_from_graph { background: var(--blue-bg); color: var(--blue); }
  .badge.rejected { background: rgba(28, 33, 29, .06); color: var(--muted); }
  .plan .pbody { padding: 16px 22px 18px; }
  .plan .sec { margin-top: 16px; }
  .plan .sec:first-child { margin-top: 0; }
  .plan .sh {
    font-size: 10.5px; font-weight: 680; color: var(--faint); letter-spacing: .1em;
    text-transform: uppercase; margin-bottom: 9px;
    display: flex; align-items: center; gap: 8px;
  }
  .plan .sh::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }
  .ichips { display: flex; flex-wrap: wrap; gap: 6px; }
  .ichip {
    font-size: 12px; background: rgba(111, 156, 127, .1); border: 1px solid rgba(111, 156, 127, .22);
    border-radius: 999px; padding: 4px 12px; color: #37523f;
  }
  .note { font-size: 13.5px; line-height: 1.75; color: #39413b; }

  /* 原子链：横向流水线 */
  .flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 0; }
  .fpair { display: flex; align-items: stretch; }  /* 箭头与节点绑成一个弹性项，换行时一起移动 */
  .fnode {
    background: rgba(255, 255, 255, .7); border: 1px solid var(--line);
    border-radius: 13px; padding: 8px 10px; min-width: 128px; max-width: 188px;
    box-shadow: 0 2px 8px rgba(20, 30, 20, .05);
  }
  .fnode .fhd { display: flex; align-items: center; gap: 8px; }
  .fnum {
    width: 21px; height: 21px; border-radius: 50%; flex: none; color: #fff;
    background: linear-gradient(135deg, var(--brand2), var(--brand3));
    font-size: 11px; font-weight: 680; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(20, 52, 35, .28);
  }
  .fid { font-family: var(--mono); font-size: 12.5px; font-weight: 650; word-break: break-all; }
  .fcard {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    background: rgba(28, 33, 29, .05); border-radius: 5px; padding: 1.5px 6px;
    display: inline-block; margin-top: 6px; max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: top;
  }
  .fio { margin-top: 7px; display: flex; flex-direction: column; gap: 4px; }
  .fio .row { display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; }
  .fio .dir { font-size: 9px; font-weight: 700; color: var(--faint); letter-spacing: .06em; flex: none; }
  .io {
    font-family: var(--mono); font-size: 9.5px; background: rgba(28, 33, 29, .045);
    border: 1px solid var(--line-soft); border-radius: 5px; padding: 1px 5px; color: #555c56;
    word-break: break-all;
  }
  .io.out { background: rgba(14, 122, 69, .08); border-color: rgba(14, 122, 69, .18); color: #2c5a3e; }
  .farrow {
    display: flex; align-items: center; padding: 0 5px; color: var(--brand3); flex: none;
  }
  /* 数据资产表 */
  .atable {
    background: rgba(255, 255, 255, .55); border: 1px solid var(--line-soft);
    border-radius: 13px; overflow: hidden;
  }
  table.assets { width: 100%; border-collapse: collapse; font-size: 12px; }
  .assets th {
    text-align: left; font-size: 10px; color: var(--faint); font-weight: 680;
    letter-spacing: .07em; text-transform: uppercase;
    padding: 8px 12px; border-bottom: 1px solid var(--line);
    background: rgba(28, 33, 29, .025);
  }
  .assets td { padding: 9px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  .assets tr:last-child td { border-bottom: none; }
  .assets tr:hover td { background: rgba(111, 156, 127, .05); }
  .assets .fn { font-family: var(--mono); font-size: 11.5px; font-weight: 600; word-break: break-all; }
  .assets .fp { font-family: var(--mono); font-size: 10px; color: var(--muted); word-break: break-all; margin-top: 2px; }
  .mreason { font-size: 10.5px; color: var(--faint); margin-top: 3px; line-height: 1.5; }
  .role { font-size: 10.5px; font-weight: 650; border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
  .role.tumor { background: var(--red-bg); color: #a83232; }
  .role.normal { background: var(--green-bg); color: var(--green); }
  .role.none { background: rgba(28, 33, 29, .06); color: var(--faint); }
  .fchip { font-family: var(--mono); font-size: 10.5px; background: var(--blue-bg); color: #3a548f;
    border-radius: 5px; padding: 2px 7px; white-space: nowrap; }
  .rawjson { margin-top: 14px; }
  .rawjson summary {
    font-size: 11.5px; color: var(--faint); cursor: pointer; user-select: none; list-style: none;
    display: inline-flex; align-items: center; gap: 5px; transition: color .15s;
  }
  .rawjson summary:hover { color: var(--muted); }
  .rawjson pre {
    margin-top: 8px; background: rgba(28, 33, 29, .035); border: 1px solid var(--line-soft);
    border-radius: 10px; padding: 10px 12px; font-family: var(--mono); font-size: 11px;
    line-height: 1.6; white-space: pre-wrap; word-break: break-all;
    max-height: 320px; overflow-y: auto; color: #4c554e;
  }
  /* 拒绝卡片 */
  .rej {
    background: var(--glass-strong); border: 1px solid rgba(255, 255, 255, .85);
    border-radius: 16px; padding: 16px 18px; display: flex; gap: 13px; align-items: flex-start;
    box-shadow: var(--shadow-card);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .rej .ric {
    width: 32px; height: 32px; border-radius: 10px; flex: none;
    background: rgba(28, 33, 29, .06); color: var(--muted);
    display: flex; align-items: center; justify-content: center;
  }
  .rej .rt { font-size: 14px; font-weight: 650; margin-bottom: 3px; }
  .rej .rr { font-size: 13px; color: var(--muted); line-height: 1.65; word-break: break-word; }

  /* Plan 生成中的骨架屏（遮罩流式 JSON） */
  .skel {
    margin-top: 6px; border-radius: 20px; overflow: hidden;
    background: var(--glass-strong); border: 1px solid rgba(255, 255, 255, .85);
    box-shadow: var(--shadow-pop); padding: 20px 22px;
    backdrop-filter: blur(26px); -webkit-backdrop-filter: blur(26px);
  }
  .skel .row { display: flex; align-items: center; gap: 13px; margin-bottom: 14px; }
  .skel .ic { width: 42px; height: 42px; border-radius: 13px; flex: none; }
  .skel .bar { height: 12px; border-radius: 6px; }
  .skel .ic, .skel .bar {
    background: linear-gradient(90deg, rgba(28,33,29,.05) 25%, rgba(111,156,127,.16) 50%, rgba(28,33,29,.05) 75%);
    background-size: 200% 100%; animation: shimmer 1.5s ease-in-out infinite;
  }
  @keyframes shimmer { from { background-position: 180% 0; } to { background-position: -20% 0; } }
  .skel .note {
    display: flex; align-items: center; gap: 8px; margin-top: 4px;
    font-size: 12px; color: var(--muted); font-family: var(--mono); letter-spacing: .02em;
  }

  /* ---------- 欢迎页 ---------- */
  .welcome { padding: 9vh 0 46px; text-align: center; animation: rise .5s ease both; }
  .welcome .mark {
    width: 62px; height: 62px; border-radius: 19px; margin: 0 auto 22px; color: #fff;
    background: linear-gradient(135deg, var(--brand1), var(--brand2) 55%, var(--brand3));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 14px 38px rgba(20, 52, 35, .3), inset 0 1px 0 rgba(255, 255, 255, .25);
  }
  .welcome .kicker {
    font-family: var(--mono); font-size: 10.5px; color: var(--faint);
    letter-spacing: .22em; text-transform: uppercase; margin-bottom: 14px;
  }
  .welcome h1 {
    font-size: 30px; font-weight: 700; letter-spacing: .01em; margin-bottom: 12px;
    background: linear-gradient(120deg, #15291d, #2c5a3e 55%, #4d7a5c);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .welcome p { color: var(--muted); font-size: 13.5px; line-height: 1.8; margin-bottom: 18px; }
  .welcome .stats {
    display: inline-flex; align-items: center; gap: 10px; margin-bottom: 32px;
    font-size: 12px; color: var(--muted); font-feature-settings: "tnum";
    background: var(--glass); border: 1px solid rgba(255, 255, 255, .78);
    border-radius: 999px; padding: 7px 16px; box-shadow: var(--shadow-card);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .welcome .stats b { color: var(--brand2); font-weight: 700; }
  .welcome .stats .sep { color: var(--faint); }
  .chips { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; }
  .chip {
    border: 1px solid rgba(255, 255, 255, .8); background: var(--glass);
    border-radius: 999px; padding: 9px 16px; font-size: 13px; cursor: pointer; color: var(--ink);
    box-shadow: var(--shadow-card); transition: all .18s;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .chip:hover {
    background: rgba(255, 255, 255, .92); transform: translateY(-1px);

<body>
<header>
  <div class="logo"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v5.2L3.6 16a3 3 0 0 0 2.7 4.4h11.4a3 3 0 0 0 2.7-4.4L16 8.2V3"/><path d="M7 15h10"/><path d="M9 3h6"/></svg></div>
  <div>
    <div class="title">Bio Pipeline Light</div>
    <div class="subtitle">生信分析链路规划 · MCP + LLM 在环推理</div>
  </div>
  <div class="spacer"></div>

</header>

<footer>

      </button>
    </div>
    <div class="hint">Enter 发送 · Shift+Enter 换行 · 规划依据来自 bio-pipeline-light 知识图谱（Neo4j）与 skill 手册</div>
  </div>
</footer>

<script>
"use strict";
const chatEl = document.getElementById("chat");
const scrollEl = document.getElementById("scroll");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const SVG_SEND = document.getElementById("sendIcon").outerHTML;
const SVG_STOP = '<svg id="sendIcon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>';
const SVG_FLASK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v5.2L3.6 16a3 3 0 0 0 2.7 4.4h11.4a3 3 0 0 0 2.7-4.4L16 8.2V3"/><path d="M7 15h10"/></svg>';
const SVG_CHECK = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
const SVG_ARROW = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>';
const SVG_CARET = '<svg class="caret" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>';

// crypto.randomUUID 仅在安全上下文（HTTPS/localhost）可用；http://<IP> 直连时回退到手写 UUID
function newSessionId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
  });
}
let sessionId = newSessionId();
let running = false;
let abortCtl = null;
let cur = null;

const EXAMPLES = [
  "我想用肝癌数据做 GO 富集分析",
  "帮我规划一个 WES 体细胞变异检测流程",
  "HRA001272 队列的样本角色分布是怎样的？",
  "对 HRA001272 做肿瘤-正常配对差异表达分析可以吗？",
];

/* ---------- 极简 Markdown 渲染 ---------- */
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function renderMarkdown(src) {
  const fences = [];
  src = src.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g, (m, lang, code) => {
    fences.push("<pre><code>" + esc(code.replace(/\n$/, "")) + "</code></pre>");
    return " F" + (fences.length - 1) + " ";
  });
  let s = esc(src);
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = s.split("\n"), out = [];
  let list = null;
  const closeList = () => { if (list) { out.push(list === "ul" ? "</ul>" : "</ol>"); list = null; } };
  for (const ln of lines) {
    let m;
    if ((m = ln.match(/^(#{1,4})\s+(.*)/))) {
      closeList(); out.push("<h" + m[1].length + ">" + m[2] + "</h" + m[1].length + ">");
    } else if ((m = ln.match(/^\s*[-*]\s+(.*)/))) {
      if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
      out.push("<li>" + m[1] + "</li>");
    } else if ((m = ln.match(/^\s*(\d+)[.)]\s+(.*)/))) {
      if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
      out.push("<li>" + m[2] + "</li>");
    } else {
      closeList(); out.push(ln);
    }
  }
  closeList();
  s = out.join("\n");
  s = s.split(/\n{2,}/).map(b =>
    /^<(h\d|ul|ol|pre)/.test(b.trim()) ? b : (b.trim() ? "<p>" + b.replace(/\n/g, "<br>") + "</p>" : "")
  ).join("\n");
  s = s.replace(/ F(\d+) /g, (m, i) => fences[+i]);
  return s;
}

/* ---------- Plan 提取 ---------- */
function extractPlan(text) {
  const start = text.indexOf("{");
  if (start < 0) return null;
  let depth = 0, inStr = false, escq = false;
  for (let i = start; i < text.length; i++) {
    const c = text[i];
    if (inStr) { if (escq) escq = false; else if (c === "\\") escq = true; else if (c === '"') inStr = false; continue; }
    if (c === '"') inStr = true;
    else if (c === "{") depth++;
    else if (c === "}") { depth--; if (depth === 0) {
      const raw = text.slice(start, i + 1);
      let plan = null;
      try { plan = JSON.parse(raw); }
      catch (e) {  // 模型偶发用中文弯引号——显示层宽容一次
        try { plan = JSON.parse(raw.replace(/[“”]/g, '"').replace(/[‘’]/g, "'")); } catch (e2) {}
      }
      if (plan && (plan.schema_version === "tool-chain/v2" || plan.status === "rejected"))
        return { plan, before: text.slice(0, start).trim(), after: text.slice(i + 1).trim() };
      return null;
    } }
  }
  return null;
}

/* ---------- Plan 渲染（结果展示是全部重点） ---------- */
function el(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; }
const STATUS_CN = { ok: "可执行", information: "信息", no_candidate: "无候选", unsupported: "暂不支持", missing_from_graph: "图内缺失" };

function planView(plan, grounded) {
  if (plan.status === "rejected") {
    const reason = String(plan.reason || "");
    const [kind, ...rest] = reason.split(/[:：]/);
    return el(`<div class="rej"><div class="ric"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg></div>
      <div><div class="rt">${kind === "privacy" ? "出于隐私保护，无法提供该信息" : "该请求不在生信规划服务范围内"}</div>
      <div class="rr">${esc(rest.join(":").trim() || reason)}</div></div></div>`);
  }
  const rec = (plan.recommendations || [])[0] || {};
  const tool = rec.tool || {};
  const data = rec.data || {};
  const intent = plan.intent || {};
  const st = plan.selection_status || "information";
  const name = tool.name || rec.pipeline_id || intent.analysis_goal || "规划结果";
  const sub = rec.pipeline_id || tool.tool_id || "";

  const root = el(`<section class="plan">
    <div class="ph"><div class="picon">${SVG_FLASK}</div>
      <div><div class="pt">${esc(name)}</div><div class="ps">${esc(sub)}${sub ? " · " : ""}tool-chain/v2</div></div>
      <div class="pmeta">${grounded === true ? '<span class="grounded">' + SVG_CHECK + '接地校验通过</span>' : ""}
      <span class="badge ${st}">${STATUS_CN[st] || esc(st)}</span></div></div>
    <div class="pbody"></div></section>`);
  const body = root.querySelector(".pbody");

  const chips = [];
  if (intent.analysis_goal) chips.push("目标 " + intent.analysis_goal);
  if (intent.disease) chips.push(intent.disease);
  if (intent.omics_type) chips.push(intent.omics_type);
  (intent.study_accessions || []).forEach(s => chips.push(s));
  if (chips.length)
    body.appendChild(el(`<div class="sec"><div class="ichips">${chips.map(c => `<span class="ichip">${esc(c)}</span>`).join("")}</div></div>`));

  // 知识查询型回答：推荐可能为空，答案在顶层 answer
  if (plan.answer)
    body.appendChild(el(`<div class="sec"><div class="note">${esc(plan.answer)}</div></div>`));
  if (rec.match_note)
    body.appendChild(el(`<div class="sec"><div class="note">${esc(rec.match_note)}</div></div>`));

  // 原子链：横向流水线视图
  const cand = (plan.candidates || [])[0];
  if (cand && Array.isArray(cand.tool_chain) && cand.tool_chain.length) {
    const ioKeys = x => Array.isArray(x) ? x : (x && typeof x === "object" ? Object.keys(x) : []);
    const nodes = [];
    cand.tool_chain.forEach((s, i) => {
      const ins = ioKeys(s.inputs), outs = ioKeys(s.outputs);
      const node = `<div class="fnode"><div class="fhd"><div class="fnum">${i + 1}</div>
        <div class="fid">${esc(s.tool_id || "?")}</div></div>
        ${s.card ? `<span class="fcard" title="${esc(s.card)}">${esc(s.card)}</span>` : ""}
        <div class="fio">
          ${ins.length ? `<div class="row"><span class="dir">IN</span>${ins.map(x => `<span class="io">${esc(x)}</span>`).join("")}</div>` : ""}
          ${outs.length ? `<div class="row"><span class="dir">OUT</span>${outs.map(x => `<span class="io out">${esc(x)}</span>`).join("")}</div>` : ""}
        </div></div>`;
      // 箭头与节点包进同一 .fpair：flex 换行时整体移动，箭头不会悬在上行末尾
      nodes.push(i === 0 ? node : `<div class="fpair"><div class="farrow">${SVG_ARROW}</div>${node}</div>`);
    });
    body.appendChild(el(`<div class="sec"><div class="sh">Atomic 链编排 · ${cand.tool_chain.length} 步</div><div class="flow">${nodes.join("")}</div></div>`));
  }

  // 数据资产
  const assets = data.assets || [];
  if (assets.length) {
    const rows = assets.map(a => {
      const role = a.sample_role ? (a.sample_role === "tumor" ? "tumor" : "normal") : "none";
      const roleTxt = a.sample_role_label || a.sample_role || "—";
      return `<tr><td><div class="fn">${esc(a.file_name || "?")}</div>
          ${a.file_path ? `<div class="fp">${esc(a.file_path)}</div>` : ""}
          ${a.match_reason ? `<div class="mreason">${esc(a.match_reason)}</div>` : ""}</td>
        <td>${a.format ? `<span class="fchip">${esc(a.format)}</span>` : ""}</td>
        <td><span class="role ${role}">${esc(roleTxt)}</span></td>
        <td class="mreason">${esc(a.study_accession || "")}</td></tr>`;
    }).join("");
    body.appendChild(el(`<div class="sec"><div class="sh">数据资产 · ${esc(data.status || "?")} · ${assets.length} 项</div>
      <div class="atable"><table class="assets"><thead><tr><th>文件</th><th>格式</th><th>角色</th><th>队列</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>`));
  } else if (data.status && data.status !== "not_applicable") {
    body.appendChild(el(`<div class="sec"><div class="sh">数据</div><div class="note">状态：${esc(data.status)}${(data.missing_asset_names || []).length ? "；缺失：" + data.missing_asset_names.map(esc).join("、") : ""}</div></div>`));
  }

  const alts = data.alternatives || [];
  if (alts.length)
    body.appendChild(el(`<div class="sec"><div class="sh">备选队列</div><div class="ichips">${
      alts.map(a => `<span class="ichip">${esc(a.study_accession || "")}${a.selected ? " ✓" : ""}</span>`).join("")}</div></div>`));

  // 原始 JSON
  const raw = el(`<details class="rawjson"><summary>${SVG_CARET}查看原始 JSON</summary><pre></pre></details>`);
  raw.querySelector("pre").textContent = JSON.stringify(plan, null, 2);
  body.appendChild(raw);
  return root;
}

/* 流式 JSON 的骨架遮罩：截图里不该出现裸 JSON 打字 */
function skeletonView() {
  return el(`<div class="skel">
    <div class="row"><div class="ic"></div>
      <div style="flex:1"><div class="bar" style="width:42%;margin-bottom:8px"></div>
      <div class="bar" style="width:24%"></div></div></div>
    <div class="bar" style="width:88%;margin-bottom:9px"></div>
    <div class="bar" style="width:64%;margin-bottom:9px"></div>
    <div class="bar" style="width:76%;margin-bottom:14px"></div>
    <div class="note"><span class="spin"></span>正在组装 tool-chain/v2 Plan …</div></div>`);
}

/* ---------- 滚动 ---------- */
function nearBottom() { return scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 120; }
function maybeScroll() { if (nearBottom()) scrollEl.scrollTop = scrollEl.scrollHeight; }

/* ---------- 消息 DOM ---------- */
function addUserMsg(text) {
  hideWelcome();
  const d = document.createElement("div");
  d.className = "msg user";
  d.innerHTML = '<div class="b"></div>';
  d.querySelector(".b").textContent = text;
  chatEl.appendChild(d);
  scrollEl.scrollTop = scrollEl.scrollHeight;
}
function newAssistantTurn() {
  const d = document.createElement("div");
  d.className = "msg assistant";
  d.innerHTML = '<div class="who"><div class="avatar"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v5.2L3.6 16a3 3 0 0 0 2.7 4.4h11.4a3 3 0 0 0 2.7-4.4L16 8.2V3"/><path d="M7 15h10"/></svg></div>Bio Pipeline Light</div><div class="body"></div>';
  chatEl.appendChild(d);
  cur = {
    root: d, body: d.querySelector(".body"),
    thinkBox: null, thinkBd: null, thinkDone: false,
    toolsWrap: null, tflow: null, toolCount: 0, toolChips: {},
    answerEl: null, answerText: "", skel: null, planRendered: false, grounded: null,
  };
  return cur;
}
function ensureThink() {
  if (cur.thinkBox) return cur.thinkBox;
  const box = document.createElement("div");
  box.className = "think";
  box.innerHTML =
    '<div class="hd"><span class="spin"></span><span class="tt">正在思考…</span>' + SVG_CARET + '</div>' +
    '<div class="bd"></div>';
  box.querySelector(".hd").onclick = () => box.classList.toggle("open");
  cur.body.appendChild(box);
  cur.thinkBox = box; cur.thinkBd = box.querySelector(".bd");
  return box;
}
function finishThink() {
  if (!cur.thinkBox || cur.thinkDone) return;
  cur.thinkDone = true;
  const hd = cur.thinkBox.querySelector(".hd");
  const sp = hd.querySelector(".spin");
  if (sp) sp.outerHTML = SVG_CARET.replace('class="caret"', 'class="caret" style="display:none"');
  hd.querySelector(".tt").textContent = "思考过程";
  // 默认折叠：思考只是辅助证据，不进截图主视觉
}
function ensureTools() {
  if (!cur.toolsWrap) {
    finishThink();
    cur.toolsWrap = document.createElement("div");
    cur.toolsWrap.className = "tools";
    cur.toolsWrap.innerHTML = '<div class="tlabel"></div><div class="tflow"></div>';
    cur.tflow = cur.toolsWrap.querySelector(".tflow");
    cur.body.appendChild(cur.toolsWrap);
  }
  return cur.toolsWrap;
}
function refreshToolLabel() {
  if (cur.toolsWrap)
    cur.toolsWrap.querySelector(".tlabel").textContent = "MCP 工具调用 · " + cur.toolCount;
}
function addToolChip(ev) {
  ensureTools();
  cur.toolCount++;
  const chip = document.createElement("span");
  chip.className = "tchip run";
  chip.innerHTML = '<span class="st-dot"></span><span class="tname"></span>' +
    (ev.auto ? '<span class="auto">auto</span>' : "");
  chip.querySelector(".tname").textContent = ev.name;
  cur.tflow.appendChild(chip);
  cur.toolChips[ev.id || ev.name + "_" + cur.toolCount] = chip;
  refreshToolLabel();
  maybeScroll();
}
function fillToolChip(ev) {
  const chip = cur.toolChips[ev.id] || Object.values(cur.toolChips).find(c =>
    c.querySelector(".tname").textContent === ev.name && c.classList.contains("run"));
  if (!chip) return;
  chip.classList.remove("run");
  chip.classList.add(ev.ok ? "ok" : "bad");
  const dur = document.createElement("span");
  dur.className = "dur";
  dur.textContent = ev.duration_ms + "ms";
  chip.appendChild(dur);
  // 服务端代跑的接地校验结论，摘到 Plan 卡片头上
  if (ev.name === "validate_plan" && ev.result && typeof ev.result === "object")
    cur.grounded = ev.result.grounded === true;
  maybeScroll();
}
function ensureAnswer() {
  if (!cur.answerEl) {
    finishThink();
    const d = document.createElement("div");
    d.className = "answer";
    cur.body.appendChild(d);
    cur.answerEl = d;
    cur.answerText = "";
  }
  return cur.answerEl;
}
function renderStream() {
  if (!cur.answerEl || cur.planRendered) return;
  const t = cur.answerText;
  if (/^\s*\{/.test(t)) {
    // 正在流式输出 JSON：用骨架屏遮住裸文本
    if (!cur.skel) { cur.answerEl.innerHTML = ""; cur.skel = skeletonView(); cur.answerEl.appendChild(cur.skel); }
  } else {
    if (cur.skel) { cur.skel.remove(); cur.skel = null; }
    cur.answerEl.innerHTML = renderMarkdown(t) + '<span class="cursor"></span>';
  }
}
function renderFinalAnswer() {
  if (!cur.answerEl || cur.planRendered) return;
  const found = extractPlan(cur.answerText);
  if (found) {
    try {
      cur.planRendered = true;
      let html = "";
      if (found.before) html += renderMarkdown(found.before);
      if (found.after) html += renderMarkdown(found.after);
      cur.answerEl.innerHTML = html;
      cur.answerEl.appendChild(planView(found.plan, cur.grounded));
    } catch (e) {  // 渲染兜底：任何渲染异常都不能吞掉答案本体
      cur.answerEl.innerHTML = renderMarkdown(cur.answerText);
    }
  } else {
    cur.answerEl.innerHTML = renderMarkdown(cur.answerText);
  }
}
function addError(message) {
  const d = document.createElement("div");
  d.className = "err";
  d.textContent = "出错了：" + message;
  (cur ? cur.body : chatEl).appendChild(d);
  scrollEl.scrollTop = scrollEl.scrollHeight;
}

/* ---------- 欢迎页 ---------- */
function showWelcome() {
  const w = document.createElement("div");
  w.className = "welcome"; w.id = "welcome";
  w.innerHTML =
    '<div class="mark"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v5.2L3.6 16a3 3 0 0 0 2.7 4.4h11.4a3 3 0 0 0 2.7-4.4L16 8.2V3"/><path d="M7 15h10"/><path d="M9 3h6"/></svg></div>' +
    '<div class="kicker">Bio-Pipeline-Light · MCP × Neo4j × LLM</div>' +
    "<h1>生信分析，先规划再执行</h1>" +
    "<p>模型在环推理连接 Neo4j 知识图谱，产出经验证接地的 tool-chain/v2 工具链 Plan</p>" +
    '<div class="stats"><span><b id="statNodes">—</b> 图谱节点</span><span class="sep">·</span>' +
    "<span><b>55</b> 工具闭集</span><span class=\"sep\">·</span><span><b>30</b> 受控功能词</span></div>" +
    '<div class="chips">' + EXAMPLES.map(e => '<button class="chip">' + e + "</button>").join("") + "</div>";
  chatEl.appendChild(w);
  w.querySelectorAll(".chip").forEach(c => c.onclick = () => { inputEl.value = c.textContent; send(); });
}
function hideWelcome() { const w = document.getElementById("welcome"); if (w) w.remove(); }

/* ---------- 发送与流式接收（SSE 契约与后端保持一致，勿动） ---------- */
async function send() {
  const text = inputEl.value.trim();
  if (!text || running) return;
  addUserMsg(text);
  inputEl.value = ""; inputEl.style.height = "auto";
  setRunning(true);
  newAssistantTurn();
  abortCtl = new AbortController();
  try {
    const resp = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session: sessionId, message: text }),
      signal: abortCtl.signal,
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status + "：" + (await resp.text()).slice(0, 200));
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const line = chunk.split("\n").find(l => l.startsWith("data:"));
        if (!line) continue;
        let ev; try { ev = JSON.parse(line.slice(5)); } catch { continue; }
        handleEvent(ev);
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") addError(e.message);
  } finally {
    finishThink();
    renderFinalAnswer();
    setRunning(false);
    abortCtl = null;
  }
}
function handleEvent(ev) {
  switch (ev.type) {
    case "thought": {
      const box = ensureThink();
      cur.thinkBd.textContent += ev.delta;
      cur.thinkBd.scrollTop = cur.thinkBd.scrollHeight;
      maybeScroll();
      break;
    }
    case "text": {
      ensureAnswer();
      cur.answerText += ev.delta;
      renderStream();
      maybeScroll();
      break;
    }
    case "tool_call": addToolChip(ev); break;
    case "tool_result": fillToolChip(ev); break;
    case "text_reset": {
      if (cur.answerEl) {
        cur.answerText = cur.answerText.slice(0, ev.keep || 0);
        if (cur.skel) { cur.skel.remove(); cur.skel = null; }
        renderStream();
      }
      break;
    }
    case "done": {
      finishThink();
      renderFinalAnswer();
      if (ev.finishReason && ev.finishReason !== "STOP") {
        const n = document.createElement("div");
        n.style.cssText = "font-size:12px;color:var(--faint);margin-top:6px";
        n.textContent = "（输出达到长度上限，可能被截断：" + ev.finishReason + "）";
        cur.body.appendChild(n);
      }
      break;
    }
    case "error": addError(ev.message); break;
  }
}
function setRunning(v) {
  running = v;
  document.getElementById("sendIcon").outerHTML = v ? SVG_STOP : SVG_SEND;
  sendBtn.title = v ? "停止" : "发送";
  inputEl.placeholder = v ? "正在生成，可点击右侧按钮停止…" : "描述你的分析需求，例如：我想用肝癌数据做 GO 富集分析";
}

/* ---------- 事件绑定 ---------- */
sendBtn.onclick = () => { if (running) { abortCtl && abortCtl.abort(); } else send(); };
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
});
document.getElementById("newChatBtn").onclick = async () => {
  if (running) { abortCtl && abortCtl.abort(); }
  try { await fetch("/api/reset", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session: sessionId }) }); } catch {}
  sessionId = newSessionId();
  chatEl.innerHTML = ""; cur = null;
  showWelcome(); inputEl.focus();
};

/* ---------- 健康检查（顺带把图谱规模填进欢迎页） ---------- */
(async () => {
  try {
    const r = await (await fetch("/api/health")).json();
    const dot = document.getElementById("healthDot"), txt = document.getElementById("healthText");
    if (r.neo4j && r.neo4j.status === "ok") {
      dot.className = "dot ok";
      const nodes = (r.neo4j.nodes || 0).toLocaleString();
      txt.textContent = "Neo4j " + nodes + " 节点 · " + r.model;
      const sn = document.getElementById("statNodes");
      if (sn) sn.textContent = nodes;
    } else {
      dot.className = "dot bad";
      txt.textContent = "Neo4j 不可用 · " + r.model;
      document.getElementById("healthPill").title =
        (r.neo4j && r.neo4j.detail) || "请检查 NEO4J_USER / NEO4J_PASSWORD / NEO4J_URL";
    }
  } catch (e) {
    document.getElementById("healthText").textContent = "后端连接失败";
    document.getElementById("healthDot").className = "dot bad";
  }
})();

showWelcome();
inputEl.focus();
</script>
</body>
